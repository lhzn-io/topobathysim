# name: "Western Long Island Sound Fusion" -> Renaming conceptually to US Coastal
name: "US Coastal Topobathy Fusion"
version: "1.1.0"
crs: "EPSG:3857"  # Web Mercator (Global Coverage)

variables:
  - name: "elevation"
    description: "Topobathymetric elevation (meters, NAVD88)"
    steps:
      # --- Tier 4: Global Context (Base) ---
      - provider: "gebco_2025"
        product: "sub_ice_topo_bathymetry"
        operator: "overwrite"
        description: "Global GEBCO 2025 Grid (Approx 450m)"

      # --- Tier 3.5: Land (Low Res) ---
      - provider: "usgs_3dep"
        product: "10m"
        operator: "overwrite"
        # Only overwrite if data exists (implicit in runtime)
        description: "USGS 3DEP 1/3 arc-second DEM (~10m)"

      # --- Tier 1b: Terrestrial Lidar ---
      - provider: "usgs_lidar"
        product: "copc"
        operator: "overwrite"
        description: "USGS 3DEP Lidar Point Cloud (Rasterized ~4m)"

      # --- Tier 3: Coastal Gap Fill ---
      - provider: "ncei_cudem"
        product: "ninth_arc"
        operator: "overwrite"
        description: "NOAA CUDEM 1/9 arc-second (~3m)"

      # --- Tier 2: High Res Bathymetry (Modeled) ---
      # Prioritize BlueTopo (Dynamic/2025+) over CUDEM (Static/2014) for timely updates.
      - provider: "noaa_bluetopo"
        product: "geotiff"
        operator: "overwrite"
        description: "NOAA BlueTopo (~2-8m)"

      # --- Tier 1a: Topobathy Lidar ---
      - provider: "noaa_topobathy"
        product: "job"
        operator: "overwrite"
        description: "NOAA Topobathy Lidar"
        filter:
          min_year: 2020
          max_resolution: 2.0

      # --- Tier 0: High Res Survey (Measured) ---
      - provider: "ncei_bag"
        product: "bathymetry"
        operator: "overwrite"
        description: "NOAA BAG Surveys (High Res Multibeam)"
        filter:
          max_depth_change: 80.0  # Remove spikes > 80m deviation from local median
