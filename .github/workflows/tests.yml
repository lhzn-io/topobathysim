name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # The geospatial stack (pdal, gdal via rasterio/pyogrio) needs conda-forge
    # binaries, so the environment comes from environment.yml rather than pip.
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install the package itself
        shell: bash -el {0}
        run: pip install -e . --no-deps

      # Gating. Runs the pinned hooks from .pre-commit-config.yaml rather than
      # whatever ruff happens to be on PATH, so CI and a local commit apply the
      # same version and the same rule selection. Grading against ambient-latest
      # is what made the first run of this workflow fail on untouched code.
      - name: Lint
        shell: bash -el {0}
        run: pre-commit run --all-files --show-diff-on-failure

      # Integration tests are excluded: they hit live NOAA, USGS and Planetary
      # Computer endpoints, take 10 to 12 minutes, and depend on a prebuilt
      # NOAA spatial index. Run them locally or via workflow_dispatch.
      - name: Unit tests
        shell: bash -el {0}
        run: python -m pytest tests/unit -m "not integration" --durations=10
